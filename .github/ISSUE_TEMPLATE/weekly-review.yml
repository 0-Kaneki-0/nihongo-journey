name: 周复盘
description: 每周日提交，与本周 7 个打卡 Issue 一起发给 AI 生成周报
title: "[周复盘] "
labels: ["weekly-review"]
body:
  - type: input
    id: checkin_days
    attributes:
      label: 本周打卡天数
      placeholder: __/7
    validations:
      required: true
  - type: input
    id: vocab_total
    attributes:
      label: 新词数（累计）
      placeholder: 数量
    validations:
      required: true
  - type: input
    id: immersion_minutes
    attributes:
      label: 听力/浸泡总时长（分钟）
      placeholder: 分钟数
    validations:
      required: true
  - type: textarea
    id: reflection
    attributes:
      label: 本周回顾
      placeholder: |
        最顺的一天：____（因为什么）
        最卡的一天：____（卡在哪）
    validations:
      required: true